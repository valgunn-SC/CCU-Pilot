<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <meta name="description" content="Générateur local de chaînes CCU Star Citizen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>CCU Pilot V0</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/icon-192.png" alt=""><div><strong>CCU Pilot</strong><span>V0 · Local first</span></div></div>
    <div class="top-actions"><span id="save-status" class="status-dot">Local</span><button id="install-app" class="ghost hidden">Installer</button><button id="cloud-login" class="ghost">Connexion Google</button></div>
  </header>
  <nav class="tabs" aria-label="Navigation principale">
    <button data-page="dashboard" class="active">Tableau de bord</button>
    <button data-page="generator">Générateur</button>
    <button data-page="chains">Chaînes</button>
    <button data-page="ccus">CCU</button>
    <button data-page="tokens">Tokens</button>
    <button data-page="history">Spéculation</button>
    <button data-page="settings">Réglages</button>
  </nav>
  <main>
    <section id="page-dashboard" class="page active"></section>
    <section id="page-generator" class="page"></section>
    <section id="page-chains" class="page"></section>
    <section id="page-ccus" class="page"></section>
    <section id="page-tokens" class="page"></section>
    <section id="page-history" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="firebase-config.js"></script>
  <script src="core.js"></script>
  <script src="seed.js"></script>
  <script src="xlsx-lite.js"></script>
  <script src="app.js"></script>
</body>
</html>
